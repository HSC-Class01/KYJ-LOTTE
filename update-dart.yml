name: Update LOTTE DART data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lotte-dart-pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests
      - name: Fetch and analyze DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          START_YEAR: "2010"
        run: python scripts/update_dart.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials.csv data/financials.json data/metadata.json data/corp_code.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update DART financial data"
            git push origin HEAD:main
          fi

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
